<!doctype html>
<html lang="zh-CN" data-bg="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamepad Overlay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#127918;</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--txt);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ============ 色调令牌 ============ */
  :root {
    --txt: #ECE6F2;
    --dim: #A9A2B6;

    /* 表面层级 surface / low / container / high */
    --surface: #0B0A0F;
    --s-low:   #131118;
    --s-cont:  #1A1820;
    --s-high:  #232029;

    --card: rgba(9, 9, 12, .965);
    --card-line: rgba(255,255,255,.085);

    /* 机身：白色塑料 */
    --body1: #FFFFFF;
    --body2: #F4F4F8;
    --body3: #CFCFDC;
    --body-line: rgba(190,190,205,.85);
    --band-hi: #2B2B34;

    /* 按键：黑色塑料 */
    --btn: #1E1E26;
    --btn-line: rgba(255,255,255,.10);
    --btn-txt: #F2F2F7;
    --btn-glyph: #F2F2F7;
    --plate: #17171E;
    --plate-line: rgba(255,255,255,.42);
    --stick-hi: #3C3C47;
    --stick-lo: #0C0C11;

    --accent: #CFBCFF;
    --accent-on: #2E1E60;

    --s-scale: 1;
    --glow: 1;
  }
  body[data-theme="ps"] { --accent: #B9C4FF; --accent-on: #1B2A66; }

  /* ============ 页面底色 ============ */
  html[data-bg="dark"] body {
    background:
      radial-gradient(1100px 620px at 50% -8%, #211D2E 0%, transparent 62%),
      radial-gradient(900px 560px at 50% 118%, #161322 0%, transparent 58%),
      #07060A;
  }
  html[data-bg="green"] body { background: #00ff00; }
  html[data-bg="none"]  body,
  html[data-bg="window"] body { background: transparent; }

  /* ============ 布局 ============ */
  .stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 8px; }

  .card {
    position: relative;
    /* 0.75 = 600/800，SVG 宽高比 */
    width: min(94vw, 880px, calc((100vh - 94px) / 0.75 / var(--s-scale)));
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 26px;
    padding: 13px 20px 11px;
    box-shadow:
      0 34px 90px -34px rgba(0,0,0,.92),
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 -52px 96px -70px var(--accent);
    transform: scale(var(--s-scale));
    transform-origin: center center;
    backdrop-filter: blur(20px) saturate(1.1);
    display: flex; flex-direction: column; gap: 3px;
  }
  html[data-bg="green"] .card,
  html[data-bg="none"]  .card,
  body.no-chrome .card {
    background: transparent; border-color: transparent;
    box-shadow: none; backdrop-filter: none; padding: 0;
  }
  /* 透明窗口模式：卡片必须不透明，否则会和抠像底色混边 */
  html[data-bg="window"] { --card: #0E0D12; }
  html[data-bg="window"] .card {
    backdrop-filter: none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 -52px 96px -70px var(--accent);
  }

  /* ============ 头部 ============ */
  .hd { display: flex; align-items: center; gap: 11px; padding: 0 3px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: #3A3644; box-shadow: 0 0 0 3px rgba(255,255,255,.035);
    transition: background .28s cubic-bezier(.2,0,0,1), box-shadow .28s;
  }
  .dot.live { background: #7FE3AC; box-shadow: 0 0 0 3px rgba(127,227,172,.14), 0 0 12px rgba(127,227,172,.75); }
  .pad-name {
    font-size: 13px; font-weight: 650; letter-spacing: .15px; opacity: .95;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  .pad-name.idle { color: var(--dim); font-weight: 500; opacity: 1; }
  .badge {
    font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: 1.1px;
    background: rgba(255,255,255,.035);
    border: 1px solid var(--card-line); border-radius: 999px; padding: 3px 10px; flex: none;
    font-variant-numeric: tabular-nums;
  }

  /* ---- 帧率 / 电量胶囊 ----
     字号按 1/--s-scale 反向补偿：缩到 55% 时字号变 CSS 的 ~17px，
     换算到屏幕上仍 ≈10px，所以小尺寸下照样看得清。 */
  .hd-r { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: .34em;
    padding: .2em .55em .22em; border-radius: 999px;
    background: rgba(255,255,255,.055);
    border: 1px solid var(--card-line);
    color: var(--txt); line-height: 1;
    font-size: max(11px, calc(9.6px / var(--s-scale)));
    font-variant-numeric: tabular-nums;
    flex: none; white-space: nowrap;
    transition: color .28s cubic-bezier(.2,0,0,1),
                background-color .28s cubic-bezier(.2,0,0,1),
                border-color .28s cubic-bezier(.2,0,0,1);
  }
  .pill b { font-weight: 750; letter-spacing: .1px; }
  .pill i {
    font-style: normal; font-size: .7em; font-weight: 600;
    letter-spacing: .55px; color: var(--dim);
  }
  .pill i { transition: color .28s; }

  .bat-ico { width: 1.25em; height: .64em; display: block; overflow: visible; }
  .bat-shell { fill: none; stroke: currentColor; stroke-width: 1.3; opacity: .5; }
  .bat-tip   { fill: currentColor; opacity: .5; }
  .bat-fill  { fill: currentColor; transform-box: fill-box; transform-origin: left center;
               transition: transform .5s cubic-bezier(.2,0,0,1); }

  #batPill[data-lv="ok"]  { color: #9BE7B0; }
  #batPill[data-lv="mid"] { color: #FFD08A; }
  #batPill[data-lv="low"] {
    color: #FF9E94; background: rgba(255,120,110,.15);
    border-color: rgba(255,140,128,.55);
    animation: batflash 1.9s ease-in-out infinite;
  }
  @keyframes batflash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,120,110,0); }
    50%      { box-shadow: 0 0 0 3px rgba(255,120,110,.18); }
  }
  #batPill[data-lv="na"] { color: var(--dim); }

  /* 缩放后位置不够，暂时收起 PAD 角标（信息在底部状态栏里还有一份） */
  html.small .hd .badge { display: none; }
  body.no-chrome .hd { display: none; }

  /* ============ 手柄 ============ */
  .padwrap { width: 100%; position: relative; }
  svg#pad { width: 100%; height: auto; display: block; overflow: visible; transition: opacity .35s, filter .35s; }
  .card.idle svg#pad { opacity: .34; filter: saturate(.25); }

  .body   { fill: url(#gBody); }
  .band   { fill: url(#gBand); pointer-events: none; }
  .rim    { fill: none; stroke: none; }
  .halo   { fill: none; stroke: rgba(206,206,238,.55); stroke-width: 9;
            filter: url(#fHalo); pointer-events: none; }
  .toplight { display: none; }
  .sheen  { fill: url(#gSheen); pointer-events: none; }
  .grip   { fill: url(#gGrip); pointer-events: none; }
  .shadow { fill: #000; opacity: .7; filter: blur(22px); }

  /* ---- 通用按键 ---- */
  .btn .shape { fill: var(--btn); stroke: var(--btn-line); stroke-width: 2; }
  .btn .txt {
    fill: var(--btn-txt); font-size: 24px; font-weight: 700; letter-spacing: .4px;
    pointer-events: none;
  }
  .btn .shape, .btn .txt, .btn .halo, .btn .ring, .btn .tab {
    transition: fill .12s cubic-bezier(.2,0,0,1), stroke .12s cubic-bezier(.2,0,0,1),
                opacity .12s cubic-bezier(.2,0,0,1), transform .16s cubic-bezier(.2,0,0,1);
  }
  /* 顶部黑带上的 LB / RB 凸台 */
  .btn .tab { fill: var(--band-hi); stroke: rgba(255,255,255,.13); stroke-width: 1.4; pointer-events: none; }
  .btn.on .tab { fill: var(--c, var(--accent)); stroke: var(--c, var(--accent)); }
  .btn .halo { fill: var(--c, var(--accent)); opacity: 0; filter: blur(11px); }
  .btn.on .halo { opacity: calc(.55 * var(--glow)); transition-duration: .05s; }
  .btn.on .shape { fill: var(--c, var(--accent)); stroke: var(--c, var(--accent)); }
  .btn.on .txt  { fill: var(--c-on, #08070C); }

  .btn .ring {
    fill: none; stroke: var(--c, var(--accent)); stroke-width: 2.4; opacity: 0;
    transform-box: fill-box; transform-origin: center; transform: scale(.6);
    transition: opacity .34s cubic-bezier(.2,0,0,1), transform .34s cubic-bezier(.2,0,0,1);
  }
  .btn.on .ring { opacity: .75; transform: scale(1.32); transition-duration: .09s; }

  /* ---- 每个键的色调三元组 ---- */
  /* 面键按实机配色：按下时整颗变成该色、字母转深色；平时是黑圆盘 + 彩色字母 */
  .a { --c: #6FC24A; --c-on: #0C2A06 }
  .b { --c: #E8483C; --c-on: #2E0503 }
  .x { --c: #3F9BE0; --c-on: #04243C }
  .y { --c: #F0C02E; --c-on: #2E2000 }
  .a .txt, .b .txt, .x .txt, .y .txt { fill: var(--c); }
  .lb, .rb, .lt, .rt { --c: #BFD4FF; --c-on: #16233D }
  .dp { --c: #C8D6F0; --c-on: #101722 }
  .ls, .rs { --c: #7FD0FF; --c-on: #04293A }
  .guide { --c: #6BE08A; --c-on: #04301C }
  .view, .menu { --c: #C8D6F0; --c-on: #101722 }

  /* PS 主题：按 DualSense 的实际键色重新映射（下✕蓝 / 右○红 / 左□粉 / 上△绿） */
  body[data-theme="ps"] .a { --c: #6FA8E8; --c-on: #04203A }
  body[data-theme="ps"] .b { --c: #F0564A; --c-on: #340604 }
  body[data-theme="ps"] .x { --c: #F07FB0; --c-on: #3A0A20 }
  body[data-theme="ps"] .y { --c: #5BC46E; --c-on: #04260E }

  .pill .txt { font-size: 19px; letter-spacing: 1.6px; font-weight: 680; }
  /* LB/RB 悬浮光条 */
  .gbar-glow { fill: var(--accent); opacity: .26; filter: blur(6px); transition: opacity .12s; }
  .gbar-core { fill: var(--accent); opacity: .62; transition: opacity .12s; }
  .gbar-hi   { fill: #FFFFFF; opacity: .28; transition: opacity .12s; }
  .lb.on .gbar-core, .rb.on .gbar-core { opacity: 1; fill: #EFE6FF;
    filter: drop-shadow(0 0 3px #FFFFFF) drop-shadow(0 0 11px rgba(198,170,255,.98)) drop-shadow(0 0 22px rgba(150,120,255,.55)); }
  .lb.on .gbar-glow, .rb.on .gbar-glow { opacity: 1; }
  .lb.on .gbar-hi, .rb.on .gbar-hi { opacity: 1; }

  .lb .txt, .rb .txt { font-size: 12.5px; letter-spacing: .5px; font-weight: 640; }

  /* ---- 扳机模拟量（LT / RT 竖排，从下往上填） ---- */
  .trig .shape { fill: rgba(255,255,255,.07); stroke: rgba(255,255,255,.22); stroke-width: 1.6; }
  .trig .txt   { fill: #E8E6EF; }
  .gtrack { fill: rgba(255,255,255,.17); }
  .gfill  { fill: var(--c, var(--accent)); }
  .trig .txt { font-size: 14px; letter-spacing: .5px; font-weight: 680; }
  .trig.on .shape { fill: color-mix(in srgb, var(--c) 56%, #12121C); stroke: #FFFFFF; stroke-width: 2.2;
    filter: drop-shadow(0 0 3px rgba(255,255,255,.85)) drop-shadow(0 0 12px rgba(198,170,255,.9)); }
  .trig.on .gfill { fill: #F4EEFF; filter: drop-shadow(0 0 6px rgba(226,214,255,1)); }
  .trig.on .txt  { fill: #FFFFFF; }

  /* ---- 摇杆：白机身上的黑色胶帽 ---- */
  .well      { fill: url(#gWellA); stroke: rgba(150,150,175,.55); stroke-width: 1.4;
    filter: drop-shadow(0 2px 5px rgba(20,18,34,.18)); }
  .stick-aura { fill: url(#gAura); opacity: .88; transition: opacity .18s; }
  .btn.on .stick-aura { opacity: 1; }
  .well-glow { fill: none; stroke: var(--c, var(--accent)); stroke-width: 2.6; opacity: 0;
               transition: opacity .12s cubic-bezier(.2,0,0,1); }
  .btn.on .well-glow { opacity: .95; }
  .cap .knob   { fill: url(#gKnobA); stroke: rgba(255,255,255,.24); stroke-width: 1.6; }
  .cap .dotc   { fill: var(--c, var(--accent)); opacity: .40; transition: opacity .12s; }
  .btn.on .cap .dotc { opacity: 1; }
  .cap .knob-hi { fill: rgba(255,255,255,.14); }
  .cap .knob-groove { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 2.2; }

  /* D-pad 中心格：黑色十字的内核 */
  .dpcross { filter: drop-shadow(0 2px 5px rgba(0,0,0,.40)); }
  .dpcross rect { fill: url(#gDpad); }
  .btn.dp .shape { fill: transparent; stroke: none; }
  .btn.dp.on .shape { fill: rgba(207,188,255,.24); }
  .dslit { fill: rgba(207,188,255,.26); }
  .btn.dp.on .dslit { fill: #F6F0FF; filter: drop-shadow(0 0 6px rgba(215,196,255,1)); }
  .dpc    { fill: url(#gDpc); stroke: rgba(228,218,255,.85); stroke-width: 1.6;
            filter: drop-shadow(0 0 6px rgba(207,188,255,.7)) drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .dpc-hi { fill: rgba(255,255,255,.16); }

  /* ---- 面键 / guide：有厚度的暗件（渐变 + 亮描边 + 接触阴影） ---- */
  .a .shape, .b .shape, .x .shape, .y .shape, .guide .shape {
    fill: url(#gFace); stroke: rgba(255,255,255,.17); stroke-width: 1.1; }
  #b-a, #b-b, #b-x, #b-y, #b-guide { filter: drop-shadow(0 2px 3px rgba(0,0,0,.42)); }
  #b-a.on .shape { filter: drop-shadow(0 0 9px rgba(111,194,74,.85)); }
  #b-b.on .shape { filter: drop-shadow(0 0 9px rgba(232,72,60,.85)); }
  #b-x.on .shape { filter: drop-shadow(0 0 9px rgba(63,155,224,.85)); }
  #b-y.on .shape { filter: drop-shadow(0 0 9px rgba(240,192,46,.90)); }
  .a .txt, .b .txt, .x .txt, .y .txt { font-weight: 800; }
  /* guide 按下：盘面不变色，只让 X 发亮 */
  .guide.on .shape { fill: url(#gFace); stroke: rgba(150,255,190,.5); }
  .guide.on .gx { stroke: #EAFFF2;
    filter: drop-shadow(0 0 5px rgba(120,255,170,1)) drop-shadow(0 0 13px rgba(120,255,170,.8)); }

  /* ---- view / menu：白机身上的白色小圆键 ---- */
  .view .shape, .menu .shape { fill: url(#gWhiteBtn); stroke: #A8A6B8; stroke-width: 2.2; }
  #b-view, #b-menu { filter: drop-shadow(0 1.8px 2.5px rgba(0,0,0,.26)); }
  .view .shape ~ rect, .menu .shape ~ rect { fill: #3A3946; }
  .view.on .shape, .menu.on .shape { fill: #E8EEFF; stroke: #9FB0D8; }
  .view.on .shape ~ rect, .menu.on .shape ~ rect { fill: #22409E;
    filter: drop-shadow(0 0 4px rgba(150,185,255,.9)); }

  /* ============ 底部 ============ */
  .ft { display: flex; align-items: center; gap: 12px; padding: 2px 3px 0; min-height: 23px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .chip {
    font-size: 10.5px; font-weight: 800; letter-spacing: .5px;
    padding: 3.5px 9px; border-radius: 999px; line-height: 1.15;
    background: color-mix(in srgb, var(--c, var(--accent)) 15%, transparent);
    color: color-mix(in srgb, var(--c, var(--accent)) 88%, #fff);
    border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 32%, transparent);
    animation: pop .2s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes pop { from { transform: scale(.82); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .stat { font-size: 10px; color: var(--dim); flex: none; font-variant-numeric: tabular-nums;
          letter-spacing: .5px; opacity: .8; }
  body.no-chrome .ft { display: none; }

  /* ============ 提示 ============ */
  .hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 13px; font-weight: 550; color: #DCD6E6; white-space: nowrap; pointer-events: none;
    background: rgba(26,24,32,.97); border: 1px solid var(--card-line);
    padding: 10px 22px; border-radius: 999px;
    box-shadow: 0 16px 40px -16px #000, inset 0 1px 0 rgba(255,255,255,.06);
    transition: opacity .32s cubic-bezier(.2,0,0,1);
  }
  .hint.hide { opacity: 0; visibility: hidden; }

  /* ============ 轴调试 ============ */
  .axes {
    display: none; gap: 10px; flex-wrap: wrap;
    font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums;
    font-family: "Cascadia Mono", Consolas, monospace;
    padding: 2px 3px 0;
  }
  .axes.show { display: flex; }
  .axes b { color: #D8D2E4; font-weight: 600; }

  /* ?still=1 : 关掉所有动画/过渡，供离屏渲染截图用 */
  html.still *, html.still *::before, html.still *::after {
    animation: none !important;
    transition: none !important;
  }
</style>
</head>
<body data-theme="xbox">
<div class="stage">
  <div class="card idle" id="card">

    <div class="hd">
      <div class="dot" id="dot"></div>
      <div class="pad-name idle" id="padName">未检测到手柄</div>
      <div class="hd-r">
        <span class="pill" id="fpsPill"><b id="fpsNum">--</b><i id="fpsLbl">Hz</i></span>
        <span class="pill" id="batPill" data-lv="na">
          <svg class="bat-ico" viewBox="0 0 27 13" aria-hidden="true">
            <rect class="bat-shell" x="1.2" y="1.2" width="20.6" height="10.6" rx="3.2"/>
            <rect class="bat-tip" x="23.4" y="4.3" width="2.1" height="4.4" rx="1.05"/>
            <rect class="bat-fill" id="batFill" x="3.4" y="3.4" width="16.2" height="6.2" rx="1.7"/>
          </svg>
          <b id="batTxt">--</b>
        </span>
        <div class="badge" id="badge">PAD 0/0</div>
      </div>
    </div>

    <div class="padwrap">
      <svg id="pad" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#FFFFFF"/>
            <stop offset="34%"  stop-color="#FBFBFE"/>
            <stop offset="70%"  stop-color="#EEEEF5"/>
            <stop offset="90%"  stop-color="#DCDCE8"/>
            <stop offset="100%" stop-color="#C4C4D6"/>
          </linearGradient>
          <linearGradient id="gBand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#41414C"/>
            <stop offset="34%"  stop-color="#191920"/>
            <stop offset="100%" stop-color="#0A0A0E"/>
          </linearGradient>
          <radialGradient id="gSheen" cx="0.5" cy="0.30" r="0.66">
            <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".85"/>
            <stop offset="52%"  stop-color="#FFFFFF" stop-opacity=".22"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="gGrip" cx="0.5" cy="0.62" r="0.58">
            <stop offset="0%"   stop-color="#7E7E96" stop-opacity=".30"/>
            <stop offset="72%"  stop-color="#7E7E96" stop-opacity=".07"/>
            <stop offset="100%" stop-color="#7E7E96" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="gWellA" cx="0.5" cy="0.56" r="0.60">
            <stop offset="0%"   stop-color="#B6B6C8"/>
            <stop offset="46%"  stop-color="#D6D6E3"/>
            <stop offset="78%"  stop-color="#EFEFF6"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
          </radialGradient>
          <radialGradient id="gKnobA" cx="0.34" cy="0.22" r="0.95">
            <stop offset="0%"   stop-color="#6E6E80"/>
            <stop offset="45%"  stop-color="#33333F"/>
            <stop offset="100%" stop-color="#0C0C12"/>
          </radialGradient>
          <filter id="fHalo" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur stdDeviation="4.2"/>
          </filter>
          <radialGradient id="gStick" cx="0.38" cy="0.26" r="0.92">
            <stop offset="0%"   stop-color="#4A4A57"/>
            <stop offset="52%"  stop-color="#1E1E27"/>
            <stop offset="100%" stop-color="#0A0A0F"/>
          </radialGradient>
          <!-- D-pad 十字的材质 -->
          <linearGradient id="gDpad" x1="0" y1="0" x2="0.8" y2="1">
            <stop offset="0%"   stop-color="#2A2A36"/>
            <stop offset="100%" stop-color="#0B0B11"/>

          <g class="btn dp" id="b-left">  <rect class="shape" x="264.5" y="303" width="53" height="36"/>
            <rect class="dslit" x="276" y="318" width="21" height="6" rx="3"/></g>
          <g class="btn dp" id="b-right"> <rect class="shape" x="316.5" y="303" width="53" height="36"/>
            <rect class="dslit" x="340" y="318" width="21" height="6" rx="3"/></g>
        </g>
        <circle class="dpc" cx="317" cy="321" r="15"/>
        <circle class="dpc-hi" cx="317" cy="317" r="10"/>

        <!-- ======= face buttons ======= -->
        <g class="btn y" id="b-y">
          <circle class="ring" cx="559" cy="180.7" r="21.4"/>
          <circle class="shape" cx="559" cy="180.7" r="21.4"/>
          <text class="txt" x="559" y="189.1" text-anchor="middle" id="t-y">Y</text>
        </g>
        <g class="btn x" id="b-x">
          <circle class="ring" cx="517.2" cy="222.5" r="21.4"/>
          <circle class="shape" cx="517.2" cy="222.5" r="21.4"/>
          <text class="txt" x="517.2" y="230.9" text-anchor="middle" id="t-x">X</text>
        </g>
        <g class="btn b" id="b-b">
          <circle class="ring" cx="600.8" cy="222.5" r="21.4"/>
          <circle class="shape" cx="600.8" cy="222.5" r="21.4"/>
          <text class="txt" x="600.8" y="230.9" text-anchor="middle" id="t-b">B</text>
        </g>
        <g class="btn a" id="b-a">
          <circle class="ring" cx="559" cy="264.3" r="21.4"/>
          <circle class="shape" cx="559" cy="264.3" r="21.4"/>
          <text class="txt" x="559" y="272.7" text-anchor="middle" id="t-a">A</text>
        </g>

        <!-- ======= view / menu / guide ======= -->
        <g class="btn view" id="b-view">
          <circle class="shape" cx="354.4" cy="222.8" r="14.2"/>
          <rect x="346.4" y="217.4" width="16" height="3.6" rx="1.8" fill="var(--btn-glyph)" opacity=".95"/>
          <rect x="346.4" y="224.9" width="10.5" height="3.6" rx="1.8" fill="var(--btn-glyph)" opacity=".95"/>
        </g>
        <g class="btn menu" id="b-menu">
          <circle class="shape" cx="445.6" cy="222.5" r="14.2"/>
          <rect x="437.6" y="216.1" width="16" height="3.4" rx="1.7" fill="var(--btn-glyph)" opacity=".95"/>
          <rect x="437.6" y="221.9" width="16" height="3.4" rx="1.7" fill="var(--btn-glyph)" opacity=".95"/>
          <rect x="437.6" y="227.7" width="16" height="3.4" rx="1.7" fill="var(--btn-glyph)" opacity=".95"/>
        </g>
        <g class="btn guide" id="b-guide">
          <circle class="ring" cx="400" cy="157.9" r="27"/>
          <circle class="shape" cx="400" cy="157.9" r="23.5"/>
          <path class="gx" d="M392.5,150.4 C396,153.6 404,161.9 407.5,165.1 M407.5,150.4 C404,153.6 396,161.9 392.5,165.1"
                stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"
                fill="none" opacity=".97"/>
        </g>
      </svg>

      <div class="hint" id="hint">连接手柄后，按任意键即可识别</div>
    </div>

    <div class="ft">
      <div class="chips" id="chips"></div>
      <div class="stat" id="stat">&nbsp;</div>
    </div>

    <div class="axes" id="axes"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================= config ================= */
  var P = new URLSearchParams(location.search);
  function num(k, d) { var v = parseFloat(P.get(k)); return isFinite(v) ? v : d; }
  var cfg = {
    scale:  num('scale', 1),
    bg:     P.get('bg') || 'dark',
    theme:  P.get('theme') || 'auto',
    dz:     num('dz', 0.07),
    demo:   P.get('demo') || '',
    still: P.get('still') === '1',
    fps: num('fps', 0),
    name: P.get('name') || '',
    chrome: P.get('chrome') !== '0',
    axes:   P.get('axes') === '1',
    glow:   P.get('glow') !== '0',
    pad:    num('pad', 0) | 0,
    bat:    P.get('bat') === null ? -2 : (num('bat', 100) | 0),
       invY:   P.get('invY') === '1'
  };

  var root = document.documentElement;
  root.setAttribute('data-bg', cfg.bg);
  if (cfg.still) document.documentElement.classList.add('still');
  document.body.classList.toggle('no-chrome', !cfg.chrome);
  root.style.setProperty('--s-scale', cfg.scale);
  root.classList.toggle('small', cfg.scale < 0.7);
  if (!cfg.glow) document.body.style.setProperty('--glow', '0');
     if (cfg.invY) YS = -1;

  /* ================= elements ================= */
  function $(id) { return document.getElementById(id); }
  var el = {
    card: $('card'), padName: $('padName'), dot: $('dot'), badge: $('badge'),
    chips: $('chips'), hint: $('hint'), stat: $('stat'), axes: $('axes'),
    fpsPill: $('fpsPill'), fpsNum: $('fpsNum'), fpsLbl: $('fpsLbl'),
    batPill: $('batPill'), batTxt: $('batTxt'), batFill: $('batFill')
  };
  var BTN = {};
  ['a','b','x','y','lb','rb','lt','rt','view','menu','guide','up','down','left','right','ls','rs']
    .forEach(function (k) { BTN[k] = $('b-' + k); });
  var fillLT = $('f-lt'), fillRT = $('f-rt'), capLS = $('c-ls'), capRS = $('c-rs');
  var TRACK_LEN = 88, CAP_R = 11;
  var YS = 1;   /* 摇杆 Y 轴符号：1 = 标准，-1 = 反向 */

  /* ================= glyphs ================= */
  var GLYPH = {
    xbox: { a:'A', b:'B', x:'X', y:'Y', lb:'LB', rb:'RB', lt:'LT', rt:'RT' },
    ps:   { a:'\u2715', b:'\u25CB', x:'\u25A1', y:'\u25B3', lb:'L1', rb:'R1', lt:'L2', rt:'R2' }
  };
  var CHIP_NAME = {
    xbox: ['A','B','X','Y','LB','RB','LT','RT','VIEW','MENU','LS','RS','\u2191','\u2193','\u2190','\u2192','GUIDE'],
    ps:   ['\u2715','\u25CB','\u25A1','\u25B3','L1','R1','L2','R2','SHARE','OPTION','L3','R3','\u2191','\u2193','\u2190','\u2192','HOME']
  };
  var CHIP_COLOR = ['a','b','x','y','lb','rb','lt','rt','view','menu','ls','rs','dp','dp','dp','dp','guide'];

  var curTheme = '', lastChipSig = '';
  function applyTheme(t) {
    if (t === curTheme) return;
    curTheme = t;
    document.body.setAttribute('data-theme', t);
    var g = GLYPH[t] || GLYPH.xbox;
    $('t-a').textContent = g.a; $('t-b').textContent = g.b;
    $('t-x').textContent = g.x; $('t-y').textContent = g.y;
    var _lb=$('t-lb'), _rb=$('t-rb'); if(_lb) _lb.textContent=g.lb; if(_rb) _rb.textContent=g.rb;
    var _lt=$('t-lt'), _rt=$('t-rt'); if(_lt) _lt.textContent=g.lt; if(_rt) _rt.textContent=g.rt;
    lastChipSig = '';
  }
  function detectTheme(pad) {
    if (cfg.theme !== 'auto') return cfg.theme;
    var id = ((pad && pad.id) || '').toLowerCase();
    return /dualsense|dualshock|sony|playstation|\b054c\b/.test(id) ? 'ps' : 'xbox';
  }

  /* ================= demo pad ================= */
  function demoPad() {
    var b = [], i;
    for (i = 0; i < 17; i++) b.push({ pressed: false, value: 0 });
    var a = [0, 0, 0, 0];
    if (cfg.demo === '1') {
      b[0]  = { pressed: true, value: 1 };
      b[4]  = { pressed: true, value: 1 };
      b[6]  = { pressed: true, value: 0.68 };
      b[12] = { pressed: true, value: 1 };
      b[15] = { pressed: true, value: 1 };
      a = [0.55, -0.72, -0.42, 0.30];
    } else if (cfg.demo === '3') {
      /* 已连接但没按键（截图用） */
    } else {
      var t = (performance.now() / 1000) % 3.6;
      var seq = [[0,0.00],[3,0.45],[6,0.90],[1,1.35],[15,1.80],[2,2.25],[4,2.70],[7,3.15]];
      for (var k = 0; k < seq.length; k++)
        if (t >= seq[k][1] && t < seq[k][1] + 0.30) b[seq[k][0]] = { pressed: true, value: 1 };
      var s = performance.now() / 1000;
      a = [Math.sin(s * 1.1) * .85, Math.cos(s * 0.9) * .85,
           Math.sin(s * 1.7 + 1) * .7, Math.cos(s * 1.3 + 2) * .7];
      b[6] = { pressed: true, value: (Math.sin(s * 2) + 1) / 2 };
      b[7] = { pressed: true, value: (Math.cos(s * 1.6) + 1) / 2 };
    }
    return { id: 'DEMO \u6a21\u62df\u624b\u67c4', index: 0, mapping: 'standard', buttons: b, axes: a,
             bat: cfg.bat >= -1 ? cfg.bat : 100 };
  }

  /* ================= polling ================= */
  var pads = [], padIdx = cfg.pad;

  /* 宿主程序（GamepadOverlay.exe）用 XInput 读手柄后推过来。
     这样窗口即使无焦点 / 鼠标穿透也能实时刷新，不依赖 Gamepad API。 */
  var nativePads = null;
  var hasNative = !!(window.chrome && window.chrome.webview && window.chrome.webview.addEventListener);

  function nativeToPad(n) {
    var btns = [], i;
    for (i = 0; i < 17; i++) {
      var v = (n.b && n.b[i]) || 0;
      var isTrig = (i === 6 || i === 7);
      btns.push({ pressed: v > (isTrig ? 0.06 : 0.5), value: v });
    }
    return {
      id: n.id || 'Xbox Controller', index: n.i || 0, mapping: 'standard',
      buttons: btns, axes: [n.lx || 0, n.ly || 0, n.rx || 0, n.ry || 0],
      bat: (typeof n.bat === 'number' ? n.bat : -1)
      , fps: (typeof n.fps === 'number' ? n.fps : -1)
    };
  }

  if (hasNative) {
    window.chrome.webview.addEventListener('message', function (e) {
      var d = e.data;
      if (d && d.t === 'pad') { nativePads = d.pads || []; lastChipSig = ''; }
    });
  }

  /* 关闭鼠标穿透时，拖标题栏可以移动浮层 */
  function enableDrag() {
    var hd = document.querySelector('.hd');
    if (!hd || !hasNative) return;
    hd.style.cursor = 'grab';
    hd.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0) return;
      ev.preventDefault();
      try { window.chrome.webview.postMessage({ t: 'drag' }); } catch (e) {}
    });
  }

  /* 把卡片在窗口里的真实矩形报给宿主，宿主据此做像素级贴边 */
  function reportRect() {
    if (!hasNative || !el.card) return;
    var r = el.card.getBoundingClientRect();
    try {
      window.chrome.webview.postMessage({
        t: 'rect',
        x: Math.round(r.left), y: Math.round(r.top),
        w: Math.round(r.width), h: Math.round(r.height),
        vw: window.innerWidth, vh: window.innerHeight
      });
    } catch (e) {}
  }
  window.__ol = {
    setInvY: function (v) { YS = v ? -1 : 1; }, report: reportRect };

  function readPads() {
    if (cfg.demo) return [demoPad()];
    if (hasNative) return (nativePads || []).map(nativeToPad);
    var out = [], list = navigator.getGamepads ? navigator.getGamepads() : null;
    if (!list) return out;
    for (var j = 0; j < list.length; j++) if (list[j]) out.push(list[j]);
    return out;
  }

  function norm(pad) {
    var n = pad.buttons.length, bv = [], bp = [];
    for (var i = 0; i < n; i++) {
      var x = pad.buttons[i];
      if (typeof x === 'number') { bv[i] = x; bp[i] = x > 0.5 ? 1 : 0; }
      else if (!x)               { bv[i] = 0; bp[i] = 0; }
      else                       { bv[i] = x.value || 0; bp[i] = x.pressed ? 1 : 0; }
    }
    return { bv: bv, bp: bp, ax: pad.axes || [] };
  }

  function trigger(bv, ax, bi, ai) {
    var v = bv[bi] || 0;
    if (ai < ax.length) { var t = (ax[ai] + 1) / 2; if (t > v) v = t; }
    return v < 0.03 ? 0 : (v > 0.99 ? 1 : v);
  }

  function setOn(node, on) {
    if (!node || node._on === on) return;
    node._on = on;
    node.classList.toggle('on', on);
  }
  function setFill(node, v) {
    if (!node) return;
    var k = Math.round(v * 100);
    if (node._k === k) return;
    node._k = k;
    var y0 = parseFloat(node.getAttribute('data-y0')) || 258;
    var len = parseFloat(node.getAttribute('data-len')) || TRACK_LEN;
    var h = len * v;
    node.setAttribute('y', (y0 + len - h).toFixed(1));
    node.setAttribute('height', h.toFixed(1));
  }
  function setCap(g, ax, ay) {
    var d = cfg.dz;
    var x = Math.abs(ax) < d ? 0 : (ax - Math.sign(ax) * d) / (1 - d);
    var y = Math.abs(ay) < d ? 0 : (ay - Math.sign(ay) * d) / (1 - d);
    var k = ((x * 200) | 0) + ',' + ((y * 200) | 0);
    if (g._k === k) return;
    g._k = k;
    g.setAttribute('transform', 'translate(' + (x * CAP_R).toFixed(1) + ',' + (YS * y * CAP_R).toFixed(1) + ')');
  }

  function renderChips(list) {
    var sig = '', i;
    for (i = 0; i < list.length; i++) sig += list[i].idx + (list[i].pct || '') + ',';
    if (sig === lastChipSig) return;
    lastChipSig = sig;
    var names = CHIP_NAME[curTheme] || CHIP_NAME.xbox, html = '';
    for (i = 0; i < list.length; i++) {
      var e = list[i];
      html += '<span class="chip ' + (CHIP_COLOR[e.idx] || 'dp') + '">' + names[e.idx] +
              (e.pct ? '&nbsp;' + e.pct + '%' : '') + '</span>';
    }
    el.chips.innerHTML = html;
  }

  function clearAll() {
    ['a','b','x','y','lb','rb','lt','rt','view','menu','guide','up','down','left','right','ls','rs']
      .forEach(function (k) { setOn(BTN[k], false); });
    setFill(fillLT, 0); setFill(fillRT, 0);
    setCap(capLS, 0, 0); setCap(capRS, 0, 0);
    renderChips([]);
  }

  /* ================= main draw ================= */
  var prevT = 0, fFrames = 0, fT = 0, curFps = 0, rafLast = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    rafLast = now;
    if (prevT) {
      fFrames++;
      if (now - fT >= 500) { curFps = Math.round(fFrames * 1000 / (now - fT)); fFrames = 0; fT = now; }
    } else fT = now;
    prevT = now;
    draw();
  }

  /* ---------- 帧率 / 电量胶囊 ---------- */
  var lastFpsTxt = '';
  var lastBatTxt = '', lastBatLv = '';

  var gameFps = -1;
  function updateFps() {
    var t, lbl;
    if (cfg.fps > 0) { t = String(Math.round(cfg.fps)); lbl = 'FPS'; }
    else if (gameFps > 0.5) { t = String(Math.round(gameFps)); lbl = 'FPS'; }
    else { t = String(curFps); lbl = 'Hz'; }
    var sig = t + lbl;
    if (sig === lastFpsTxt) return;
    lastFpsTxt = sig;
    el.fpsNum.textContent = t;
    el.fpsLbl.textContent = lbl;
    el.fpsPill.title = (lbl === 'FPS' ? '\u6e38\u620f\u5e27\u7387' : '\u6d6e\u5c42\u5237\u65b0\u7387');
  }

  function updateBattery(bat) {
    if (cfg.bat >= 0) bat = cfg.bat;      /* ?bat= 强制覆盖，截图和演示用 */
    var lv, txt, w;
    if (typeof bat !== 'number' || bat < 0) {
      lv = 'na'; txt = '--'; w = 0;
    } else {
      var n = Math.max(0, Math.min(100, Math.round(bat)));
      txt = n + '%';
      lv = n <= 20 ? 'low' : (n <= 45 ? 'mid' : 'ok');
      w = n === 0 ? 0.02 : Math.max(0.05, n / 100);
    }
    if (lv !== lastBatLv) { lastBatLv = lv; el.batPill.setAttribute('data-lv', lv); }
    if (txt !== lastBatTxt) { lastBatTxt = txt; el.batTxt.textContent = txt; }
    el.batFill.style.transform = 'scaleX(' + w.toFixed(3) + ')';
  }

  function draw() {
    pads = readPads();
    var connected = pads.length > 0;
    el.dot.classList.toggle('live', connected);
    el.card.classList.toggle('idle', !connected);
    el.hint.classList.toggle('hide', connected);
    el.badge.textContent = 'PAD ' + (connected ? (Math.min(padIdx, pads.length - 1) + 1) : 0) + '/' + pads.length;
    updateFps();

    if (!connected) {
      el.padName.textContent = '\u672a\u68c0\u6d4b\u5230\u624b\u67c4';
      el.padName.classList.add('idle');
      el.stat.textContent = '\u7b49\u5f85\u8fde\u63a5';
      updateBattery(-1);
      clearAll();
      return;
    }

    if (padIdx >= pads.length) padIdx = pads.length - 1;
    if (padIdx < 0) padIdx = 0;
    gameFps = (typeof pads[padIdx].fps === 'number') ? pads[padIdx].fps : -1;
    var pad = pads[padIdx];
    el.padName.textContent = cfg.name ? cfg.name : String(pad.id || 'Gamepad').replace(/\s*\(.*?\)\s*/g, ' ').trim();
    el.padName.classList.remove('idle');
    applyTheme(detectTheme(pad));
    updateBattery(pad.bat);

    var s = norm(pad), bv = s.bv, bp = s.bp, ax = s.ax;
    var has = function (i) { return i < bp.length; };

    setOn(BTN.a, has(0) && bp[0]);  setOn(BTN.b, has(1) && bp[1]);
    setOn(BTN.x, has(2) && bp[2]);  setOn(BTN.y, has(3) && bp[3]);

    setOn(BTN.lb, has(4) && (bp[4] || bv[4] > 0.5));
    setOn(BTN.rb, has(5) && (bp[5] || bv[5] > 0.5));

    var ltV = trigger(bv, ax, 6, 4), rtV = trigger(bv, ax, 7, 5);
    setOn(BTN.lt, ltV > 0.06); setOn(BTN.rt, rtV > 0.06);
    setFill(fillLT, ltV); setFill(fillRT, rtV);

    setOn(BTN.up,    has(12) && bp[12]);  setOn(BTN.down, has(13) && bp[13]);
    setOn(BTN.left,  has(14) && bp[14]);  setOn(BTN.right, has(15) && bp[15]);
    setOn(BTN.view,  has(8) && bp[8]);    setOn(BTN.menu, has(9) && bp[9]);
    setOn(BTN.guide, has(16) && bp[16]);
    setOn(BTN.ls,    has(10) && bp[10]);  setOn(BTN.rs,  has(11) && bp[11]);

    setCap(capLS, ax[0] || 0, ax[1] || 0);
    setCap(capRS, ax[2] || 0, ax[3] || 0);

    var out = [], order = [0,1,2,3,4,5,12,13,14,15,16,10,11,8,9];
    for (var q = 0; q < order.length; q++) {
      var idx = order[q];
      if (has(idx) && bp[idx]) out.push({ idx: idx });
    }
    if (ltV > 0.06) out.push({ idx: 6, pct: Math.round(ltV * 100) });
    if (rtV > 0.06) out.push({ idx: 7, pct: Math.round(rtV * 100) });
    renderChips(out);

    el.stat.textContent = (cfg.fps > 0 ? Math.round(cfg.fps) + ' FPS' : curFps + ' Hz') + ' \u00b7 ' + (pad.mapping === 'standard' ? 'standard' : 'generic') +
                          ' \u00b7 ' + bp.length + 'btn';

    if (cfg.axes) {
      el.axes.classList.add('show');
      var t = [];
      for (var z = 0; z < ax.length; z++)
        t.push('A' + z + ' <b>' + (ax[z] >= 0 ? ' ' : '') + ax[z].toFixed(2) + '</b>');
      t.push('LT <b>' + ltV.toFixed(2) + '</b>', 'RT <b>' + rtV.toFixed(2) + '</b>');
      el.axes.innerHTML = t.join(' &nbsp;');
    }
  }

  /* rAF stops when the window is occluded; watchdog keeps the overlay live */
  setInterval(function () { if (performance.now() - rafLast > 260) draw(); }, 120);

  requestAnimationFrame(frame);
  applyTheme('xbox');
  enableDrag();
  reportRect();
  setTimeout(reportRect, 260);
  window.addEventListener('resize', function () { reportRect(); });

  /* ================= events ================= */
  window.addEventListener('gamepadconnected', function () { lastChipSig = ''; });
  window.addEventListener('gamepaddisconnected', function () { lastChipSig = ''; });

  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase(), n = Math.max(1, pads.length);
    if (k === ']') { padIdx = (padIdx + 1) % n; lastChipSig = ''; }
    else if (k === '[') { padIdx = (padIdx - 1 + n) % n; lastChipSig = ''; }
    else if (k === 'f') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
    else if (k === 'd') { cfg.axes = !cfg.axes; el.axes.classList.toggle('show', cfg.axes); }
    else if (k === 'h') { document.body.classList.toggle('no-chrome'); }
    else if (k === 't') { applyTheme(curTheme === 'xbox' ? 'ps' : 'xbox'); }
  });
})();
</script>
</body>
</html>
